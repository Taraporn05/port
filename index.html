<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: white;
      padding: 20px;
    }
    h2 { font-size: 24px; margin-bottom: 16px; color: #e94560; }
    img {
      max-width: 850px;
      width: 95%;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #c73652; }
    button:disabled { background: #555; cursor: default; }
    #pageNum { font-size: 18px; min-width: 100px; text-align: center; }
    .dots { display: flex; gap: 8px; margin-bottom: 16px; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
    }
    .dot.active { background: #e94560; }
  </style>
</head>
<body>

  <h2>📁 Portfolio ของฉัน</h2>
  <div class="dots" id="dots"></div>
  <img id="slide" src="immage/1.png" alt="Portfolio Page">
  <div class="controls">
    <button id="prev" onclick="changePage(-1)" disabled>◀ ก่อนหน้า</button>
    <span id="pageNum">1 / 13</span>
    <button id="next" onclick="changePage(1)">ถัดไป ▶</button>
  </div>

  <script>
    let current = 1;
    const total = 13;

    const dotsContainer = document.getElementById('dots');
    for (let i = 1; i <= total; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 1 ? ' active' : '');
      dot.onclick = () => goToPage(i);
      dotsContainer.appendChild(dot);
    }

    function goToPage(n) {
      current = n;
      document.getElementById('slide').src = 'immage/' + current + '.png';
      document.getElementById('pageNum').textContent = current + ' / ' + total;
      document.getElementById('prev').disabled = current === 1;
      document.getElementById('next').disabled = current === total;
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i + 1 === current);
      });
    }

    function changePage(dir) { goToPage(current + dir); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && current < total) changePage(1);
      if (e.key === 'ArrowLeft' && current > 1) changePage(-1);
    });
  </script>

</body>
</html>
